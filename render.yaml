# Personal Resale OS V2 — Render Blueprint (Infrastructure as Code)
#
# Struktur: Monorepo mit separaten Ordnern `backend/` (NestJS) und `frontend/`
# (Vite/React). Jeder Service referenziert seinen Ordner über `rootDir`.
#
# Plan-/Region-Hinweis: Es wird bewusst kein `plan:` gesetzt (Render nutzt dann
# den Default: 0.5 CPU/512MB für Web/Worker, 0.1 CPU/256MB für Postgres,
# 256MB für Key Value). Für einen dauerhaften Betrieb (v.a. Postgres — der
# kostenlose Plan läuft nach 30 Tagen ab und wird nicht automatisch erneuert!)
# sollte vor dem produktiven Go-Live bewusst ein bezahlter Plan gewählt werden.
# Region ist einheitlich auf `frankfurt` gesetzt (Zielnutzer: Deutschland).

databases:
  - name: resale-os-db
    databaseName: resale_os
    user: resale_os
    region: frankfurt
    postgresMajorVersion: "16"
    # ipAllowList bewusst weggelassen -> alle IPs erlaubt, Zugriff bleibt
    # trotzdem durch Credentials geschützt. Bei Bedarf hier einschränken.

envVarGroups:
  - name: resale-os-shared
    envVars:
      - key: NODE_ENV
        value: production
      # Wird von beiden Backend-Prozessen (Web + Worker) zum Signieren von
      # JWT-Sessions (Actor-Context, Doc 03 §11) verwendet.
      - key: JWT_SECRET
        generateValue: true
      # Platzhalter für die künftige echte Gemini-Anbindung (aktuell wird
      # MockGeminiVisionProvider verwendet, dieser Wert wird von KEINEM
      # Code gelesen). Bewusst ein fester Platzhalter statt `sync: false`,
      # damit der erste Blueprint-Deploy nicht unnötig nach einem Wert
      # fragt, den es noch gar nicht gibt — beim echten Gemini-Anschluss
      # hier auf `sync: false` umstellen.
      - key: GEMINI_API_KEY
        value: unused-mock-provider-active
      # --- Actor Authority Model (Doc 03 §2/§4) — ohne diese Werte lehnt
      # ActorContextGuard jeden Request ab, die App wäre nach dem Deploy
      # komplett unbenutzbar. APP_USER_ID ist bewusst FEST (nicht
      # generateValue), weil sie exakt mit der Zeile übereinstimmen muss,
      # die die Migration 003_seed_single_user anlegt.
      - key: APP_ACCESS_TOKEN
        generateValue: true
      - key: APP_USER_ID
        value: "00000000-0000-0000-0000-000000000000"
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      # Einziger aktiver Verkaufskanal (docs/README.md §4e-Revision,
      # September 2026) — kein WEBHOOK_SECRET_EBAY mehr nötig.
      - key: WEBHOOK_SECRET_KLEINANZEIGEN
        generateValue: true
      - key: SALE_CONFLICT_DEBOUNCE_MS
        value: "15000"
      # ACHTUNG (siehe LocalDiskStorageProvider-Doku): Render-Webservices
      # haben ein FLÜCHTIGES Dateisystem — hochgeladene Fotos unter
      # UPLOAD_DIR gehen bei jedem Redeploy/Neustart verloren. Für einen
      # echten Go-Live muss das durch einen S3-artigen StorageProvider
      # ersetzt werden (siehe Abschlussbericht) — für den ersten Web-Test
      # bewusst unverändert gelassen.
      - key: UPLOAD_DIR
        value: uploads

services:
  # ------------------------------------------------------------------------
  # Redis (Render Key Value) — BullMQ-Broker für Webhook-Folgejobs,
  # Publishing-Retries und S3-Garbage-Collection (Schritt 5).
  # ------------------------------------------------------------------------
  - type: keyvalue
    name: resale-os-redis
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: [] # nur intern über das private Netzwerk erreichbar

  # ------------------------------------------------------------------------
  # Backend Web Service (NestJS) — REST-API, Webhook-Ingestion (Doc 04).
  # ------------------------------------------------------------------------
  - type: web
    name: resale-os-backend
    runtime: node
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci && npm run build
    # Migrationen laufen explizit als eigener Deploy-Schritt (Doc 01 Strict
    # Rule: kein `synchronize`, kein implizites `migrationsRun` im Prozess-Boot).
    preDeployCommand: npm run migration:run
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - fromGroup: resale-os-shared
      - key: DATABASE_URL
        fromDatabase:
          name: resale-os-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: resale-os-redis
          property: connectionString

  # ------------------------------------------------------------------------
  # Background Worker (BullMQ Consumer) — kein HTTP-Listener.
  # ------------------------------------------------------------------------
  - type: worker
    name: resale-os-worker
    runtime: node
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run worker:prod
    envVars:
      - fromGroup: resale-os-shared
      - key: DATABASE_URL
        fromDatabase:
          name: resale-os-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: resale-os-redis
          property: connectionString

  # ------------------------------------------------------------------------
  # Frontend Static Site (Vite/React PWA, Schritt 6).
  # ------------------------------------------------------------------------
  - type: web
    name: resale-os-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Onrender.com-Hostnamen sind deterministisch (<service-name>.onrender.com).
      # Render unterstützt keine String-Interpolation in render.yaml, daher
      # hier als fester Wert hinterlegt — muss bei Umbenennung von
      # `resale-os-backend` mit angepasst werden.
      - key: VITE_API_BASE_URL
        value: https://resale-os-backend.onrender.com
    routes:
      # SPA-Fallback: alle Pfade auf index.html rewriten (Client-Side-Routing).
      - type: rewrite
        source: /*
        destination: /index.html
