# Personal Resale OS V2 — Render Blueprint (Infrastructure as Code)
#
# Struktur: Monorepo mit separaten Ordnern `backend/` (NestJS) und `frontend/`
# (Vite/React). Jeder Service referenziert seinen Ordner über `rootDir`.
#
# Plan-/Kosten-Korrektur (September 2026): Frühere Fassung dieser Datei
# setzte bewusst KEIN `plan:` — das war ein echter Fehler, kein neutraler
# Default. Laut Render-Doku (render.com/docs/blueprint-spec, Feld `plan`)
# ist der Default beim Weglassen NICHT der kostenlose Plan, sondern:
#   Web/Worker  -> 0.5c-512mb  = 7 $/Monat JE Service
#   Key Value   -> 256mb       = 10 $/Monat
#   Postgres    -> 0.1c-256mb  = 6 $/Monat
# Macht zusammen ~30 $/Monat für Backend+Worker+Redis+Postgres, obwohl nie
# bewusst ein bezahlter Plan gewählt wurde — das erklärt die volle Rechnung.
# Jeder Service unten hat deshalb jetzt explizit `plan: free` — macht den
# ganzen Stack (inkl. der ohnehin immer kostenlosen Static-Site-Frontend)
# nominell 0 $/Monat. Der einzige verbleibende Haken: der kostenlose
# Postgres-Plan läuft 30 Tage nach Erstellung ab und wird NICHT automatisch
# verlängert (danach: Daten weg, außer man exportiert/upgraded vorher
# bewusst auf einen bezahlten Plan, ~6-7 $/Monat). Freie Web-Services
# schlafen zudem nach ~15 Min. Inaktivität ein (Cold-Start beim nächsten
# Request) — für eine Einzelnutzer-App akzeptabel.
# Region ist einheitlich auf `frankfurt` gesetzt (Zielnutzer: Deutschland).
#
# Zwei weitere Free-Tier-Korrekturen (nach echtem Deploy-Versuch, September
# 2026), beide von Render beim Blueprint-Sync selbst gemeldet bzw. in der
# Doku bestätigt:
# 1. `preDeployCommand` wird auf kostenlosen Web-Services NICHT unterstützt
#    -> die Migration läuft jetzt als Teil von `buildCommand`.
# 2. Background-Worker-Services unterstützen GAR KEINEN kostenlosen Plan
#    (render.com/docs/free listet nur Web Service/Postgres/Key Value) ->
#    der BullMQ-Consumer läuft jetzt im selben Prozess wie die HTTP-API
#    (siehe app.module.ts), der separate `worker`-Service entfällt hier.

databases:
  - name: resale-os-db
    databaseName: resale_os
    user: resale_os
    region: frankfurt
    postgresMajorVersion: "16"
    plan: free
    # ipAllowList bewusst weggelassen -> alle IPs erlaubt, Zugriff bleibt
    # trotzdem durch Credentials geschützt. Bei Bedarf hier einschränken.

envVarGroups:
  - name: resale-os-shared
    envVars:
      - key: NODE_ENV
        value: production
      # Wird von beiden Backend-Prozessen (Web + Worker) zum Signieren von
      # JWT-Sessions (Actor-Context, Doc 03 §11) verwendet.
      - key: JWT_SECRET
        generateValue: true
      # Platzhalter für die künftige echte Gemini-Anbindung (aktuell wird
      # MockGeminiVisionProvider verwendet, dieser Wert wird von KEINEM
      # Code gelesen). Bewusst ein fester Platzhalter statt `sync: false`,
      # damit der erste Blueprint-Deploy nicht unnötig nach einem Wert
      # fragt, den es noch gar nicht gibt — beim echten Gemini-Anschluss
      # hier auf `sync: false` umstellen.
      - key: GEMINI_API_KEY
        value: unused-mock-provider-active
      # --- Actor Authority Model (Doc 03 §2/§4) — ohne diese Werte lehnt
      # ActorContextGuard jeden Request ab, die App wäre nach dem Deploy
      # komplett unbenutzbar. APP_USER_ID ist bewusst FEST (nicht
      # generateValue), weil sie exakt mit der Zeile übereinstimmen muss,
      # die die Migration 003_seed_single_user anlegt.
      - key: APP_ACCESS_TOKEN
        generateValue: true
      - key: APP_USER_ID
        value: "00000000-0000-0000-0000-000000000000"
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      # Einziger aktiver Verkaufskanal (docs/README.md §4e-Revision,
      # September 2026) — kein WEBHOOK_SECRET_EBAY mehr nötig.
      - key: WEBHOOK_SECRET_KLEINANZEIGEN
        generateValue: true
      - key: SALE_CONFLICT_DEBOUNCE_MS
        value: "15000"
      # ACHTUNG (siehe LocalDiskStorageProvider-Doku): Render-Webservices
      # haben ein FLÜCHTIGES Dateisystem — hochgeladene Fotos unter
      # UPLOAD_DIR gehen bei jedem Redeploy/Neustart verloren. Für einen
      # echten Go-Live muss das durch einen S3-artigen StorageProvider
      # ersetzt werden (siehe Abschlussbericht) — für den ersten Web-Test
      # bewusst unverändert gelassen.
      - key: UPLOAD_DIR
        value: uploads

services:
  # ------------------------------------------------------------------------
  # Redis (Render Key Value) — BullMQ-Broker für Webhook-Folgejobs,
  # Publishing-Retries und S3-Garbage-Collection (Schritt 5).
  # ------------------------------------------------------------------------
  - type: keyvalue
    name: resale-os-redis
    region: frankfurt
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: [] # nur intern über das private Netzwerk erreichbar

  # ------------------------------------------------------------------------
  # Backend Web Service (NestJS) — REST-API, Webhook-Ingestion (Doc 04).
  # ------------------------------------------------------------------------
  - type: web
    name: resale-os-backend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    # Migrationen laufen weiterhin explizit vor dem Start, nur nicht mehr
    # über `preDeployCommand` (kostenlose Web-Services unterstützen das
    # Feld nicht) — stattdessen als letzter Schritt von `buildCommand`.
    # Bleibt trotzdem "Doc 01 Strict Rule"-konform: kein `synchronize`,
    # kein implizites `migrationsRun` im Prozess selbst.
    #
    # `--include=dev` ist Pflicht, kein Stilmittel: NODE_ENV=production
    # (siehe envVarGroup oben) lässt `npm ci` sonst alle devDependencies
    # weglassen — genau dort liegen aber @nestjs/cli (`nest build`),
    # typescript UND ts-node (`npm run migration:run` braucht es für die
    # .ts-Migrationsdateien). Ohne das Flag schlägt der Build mit
    # "nest: not found" fehl (so beim ersten echten Deploy-Versuch
    # passiert). Zur Laufzeit stört das Mehr an installierten Paketen
    # nicht — `start:prod` führt nur die kompilierten dist/*.js aus.
    buildCommand: npm ci --include=dev && npm run build && npm run migration:run
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - fromGroup: resale-os-shared
      - key: DATABASE_URL
        fromDatabase:
          name: resale-os-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: resale-os-redis
          property: connectionString

  # ------------------------------------------------------------------------
  # KEIN separater Background-Worker-Service mehr (siehe Kommentar oben):
  # Render Background Worker unterstützen keinen kostenlosen Plan. Der
  # BullMQ-Consumer läuft stattdessen im Backend-Web-Service-Prozess mit
  # (app.module.ts importiert SaleConflictWorkerModule direkt). `worker.ts`
  # bleibt im Repo für einen künftigen Wechsel auf einen bezahlten Plan mit
  # getrenntem Worker.
  # ------------------------------------------------------------------------

  # ------------------------------------------------------------------------
  # Frontend Static Site (Vite/React PWA, Schritt 6).
  # ------------------------------------------------------------------------
  - type: web
    name: resale-os-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Onrender.com-Hostnamen sind deterministisch (<service-name>.onrender.com).
      # Render unterstützt keine String-Interpolation in render.yaml, daher
      # hier als fester Wert hinterlegt — muss bei Umbenennung von
      # `resale-os-backend` mit angepasst werden.
      - key: VITE_API_BASE_URL
        value: https://resale-os-backend.onrender.com
    routes:
      # SPA-Fallback: alle Pfade auf index.html rewriten (Client-Side-Routing).
      - type: rewrite
        source: /*
        destination: /index.html
